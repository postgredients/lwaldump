name: PostgreSQL compatibility

on:
  push:
  pull_request:

jobs:
  live-standby:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg_major: 14
            pg_tag: 14-bookworm
          - pg_major: 15
            pg_tag: 15-bookworm
          - pg_major: 16
            pg_tag: 16-bookworm
          - pg_major: 17
            pg_tag: 17-bookworm
          - pg_major: 18
            pg_tag: 18-bookworm
          - pg_major: 19
            pg_tag: 19beta3-bookworm
    steps:
      - uses: actions/checkout@v4
      - name: Build extension
        run: >-
          docker build
          --build-arg PG_TAG=${{ matrix.pg_tag }}
          --build-arg PG_MAJOR=${{ matrix.pg_major }}
          -f tests/Dockerfile
          -t lwaldump-test:${{ matrix.pg_major }}
          .
      - name: Test fenced standby WAL endpoint
        run: docker run --rm -e PG_MAJOR=${{ matrix.pg_major }} lwaldump-test:${{ matrix.pg_major }}
